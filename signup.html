<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MeetAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b14;
      color: #ffffff;
      padding: 20px;
    }

    main.signup-container {
      width: 100%;
      max-width: 420px;
      background: #111625;
      border: 1px solid #252b3d;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .logo a {
      color: #ffffff;
      text-decoration: none;
    }

    .logo span {
      color: #6c63ff;
    }

    .subtitle {
      text-align: center;
      color: #9ca3b5;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d7dbea;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid #30374d;
      background: #0b0f1c;
      color: #ffffff;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.25);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border: none;
      border-radius: 9px;
      background: #6c63ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button[type="submit"]:hover {
      background: #584ff0;
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #9ca3b5;
      font-size: 14px;
    }

    .login a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: 500;
    }

    .login a:hover {
      text-decoration: underline;
    }

    .back {
      display: inline-block;
      width: 100%;
      text-align: center;
      margin-top: 20px;
      color: #777f94;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .back:hover {
      color: #a0a8bf;
    }
  </style>
</head>

<body>

  <main class="signup-container">

    <h1 class="logo">
      <a href="index.html">Meet<span>AI</span></a>
    </h1>

    <p class="subtitle">
      Create your free account
    </p>

    <form id="signupForm">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password (min. 6 characters)"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>

      <button type="submit">
        Create Free Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Log in</a>
    </div>

    <a class="back" href="index.html">
      &larr; Back to MeetAI
    </a>

  </main>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();

      alert(`Welcome to MeetAI, ${name}! Your account setup is ready.`);

      // Temporary demo redirect
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
